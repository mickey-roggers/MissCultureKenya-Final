          maxLength: 100
        title:
          type: string
          maxLength: 200
        bio:
          type: string
        mission_statement:
          type: string
        profile_image:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - bio
      - created_at
