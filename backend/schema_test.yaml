          readOnly: true
        title:
          type: string
          maxLength: 200
        achievement_type:
          $ref: '#/components/schemas/AchievementTypeEnum'
        description:
          type: string
        image:
          type: string
          nullable: true
        year:
          type: integer
          maximum: 2147483647
          minimum: -2147483648
        featured:
          type: boolean
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - achievement_type
      - created_at
      - description
      - gallery_photos
      - id
      - image_url
      - title
      - year
    AchievementTypeEnum:
      enum:
      - sports
      - technology
      - arts
      - tourism
      - innovation
      type: string
