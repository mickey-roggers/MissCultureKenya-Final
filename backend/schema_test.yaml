openapi: 3.0.3
info:
  title: Miss Culture Global Kenya API
  version: 1.0.0
  description: REST API for events, ticketing, voting, contributions, gallery and
    site content.
paths:
  /api/admin-debug/:
    get:
      operationId: api_admin_debug_retrieve
      description: Admin-only debug endpoint with detailed information
      tags:
      - api
      security:
      - cookieAuth: []
      - basicAuth: []
      responses:
        '200':
          description: No response body
  /api/db-performance/:
    get:
      operationId: api_db_performance_retrieve
      description: Check database query performance and connection health
      tags:
      - api
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          description: No response body
  /api/debug/:
    get:
      operationId: api_debug_retrieve
      description: Public debug endpoint with safe configuration info
      tags:
      - api
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          description: No response body
  /api/events/audit-logs/:
    get:
      operationId: api_events_audit_logs_list
      parameters:
      - in: query
        name: action
        schema:
          type: string
          enum:
          - admin_action
          - contestant_edit
          - event_setting_change
          - payment_adjustment
          - payment_verified
          - ticket_issued
          - vote_reversal
        description: |-
          * `vote_reversal` - Vote Reversal
          * `contestant_edit` - Contestant Edit
          * `event_setting_change` - Event Setting Change
          * `payment_adjustment` - Payment Adjustment
          * `payment_verified` - Payment Verified
          * `ticket_issued` - Ticket Issued
          * `admin_action` - Admin Action
      - in: query
        name: event
        schema:
          type: integer
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      tags:
      - api
      security:
      - cookieAuth: []
      - basicAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAuditLogList'
          description: ''
  /api/events/audit-logs/{id}/:
    get:
      operationId: api_events_audit_logs_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this Events - Audit Log.
        required: true
      tags:
      - api
      security:
      - cookieAuth: []
      - basicAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditLog'
          description: ''
  /api/events/categories/:
    get:
      operationId: api_events_categories_list
      parameters:
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - api
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedEventCategoryList'
          description: ''
  /api/events/categories/{id}/:
    get:
      operationId: api_events_categories_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this Events - Category.
        required: true
      tags:
      - api
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventCategory'
          description: ''
  /api/events/cb/:
    post:
      operationId: api_events_cb_create
      description: |-
        M-Pesa Daraja STK Push callback endpoint.
        Processes payment callbacks and routes based on payment_purpose.

        IMPORTANT: This endpoint always responds with HTTP 200 and the
        Safaricom-expected acknowledgement body. Returning any non-200 status makes
        Safaricom retry the same callback repeatedly, which would double-count votes
        or resend tickets. All errors are logged instead of surfaced as 500s.
      tags:
      - api
      security:
      - {}
      responses:
        '200':
          description: No response body
  /api/events/checkin/events/:
    get:
      operationId: api_events_checkin_events_retrieve
      description: |-
        Public list of events that have check-in enabled (a PIN set).

        Only exposes non-sensitive fields so staff can pick an event to check in.
      tags:
      - api
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          description: No response body
  /api/events/checkin/list/:
    post:
      operationId: api_events_checkin_list_create
      description: |-
        PIN-protected list of tickets for one event's gate check-in page.

        Body: { event (id), pin, search? }
      tags:
      - api
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          description: No response body
  /api/events/checkin/toggle/:
    post:
      operationId: api_events_checkin_toggle_create
      description: |-
        PIN-protected check-in toggle. Marks a ticket used/unused (never deletes).

        Body: { event (id), pin, ticket_id (or ticket_code), is_used (bool) }
      tags:
      - api
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          description: No response body
  /api/events/contestants/:
    get:
      operationId: api_events_contestants_list
      parameters:
      - in: query
        name: contestant_category
        schema:
          type: integer
      - in: query
        name: event
        schema:
          type: integer
      - in: query
        name: is_active
        schema:
          type: boolean
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - api
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedContestantList'
          description: ''
  /api/events/contestants/{id}/:
    get:
      operationId: api_events_contestants_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this Events - Contestant.
        required: true
      tags:
      - api
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContestantPublic'
          description: ''
  /api/events/contestants/{id}/public_page/:
    get:
      operationId: api_events_contestants_public_page_retrieve
      description: Get public contestant data for shareable pages
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this Events - Contestant.
        required: true
      tags:
      - api
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Contestant'
          description: ''
  /api/events/contributions/{id}/:
    get:
      operationId: api_events_contributions_retrieve
      description: 'Public: poll the status of a contribution by id (for the STK flow).'
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - api
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          description: No response body
  /api/events/contributions/initiate/:
    post:
      operationId: api_events_contributions_initiate_create
      description: |-
        Initiate an M-Pesa STK Push for a public contribution/donation.

        Contributions are tracked in the separate Contribution model (kept apart
        from tickets/votes so vote counts are never affected). Confirmation happens
        asynchronously via the shared mpesa-callback endpoint.
      tags:
      - api
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          description: No response body
  /api/events/events/:
    get:
      operationId: api_events_events_list
      parameters:
      - in: query
        name: city
        schema:
          type: string
      - in: query
        name: country
        schema:
          type: string
      - in: query
        name: event_status
        schema:
          type: string
          enum:
          - active
          - archived
          - draft
          - voting_closed
          - voting_open
        description: |-
          * `draft` - Draft
          * `active` - Active
          * `voting_open` - Voting Open
          * `voting_closed` - Voting Closed
          * `archived` - Archived
      - in: query
        name: event_type
        schema:
          type: string
          enum:
          - appearance
          - award
          - charity
          - conference
          - cultural_event
          - media
          - other
          - workshop
        description: |-
          * `appearance` - Public Appearance
          * `cultural_event` - Cultural Event
          * `charity` - Charity Event
          * `media` - Media Appearance
          * `award` - Award Ceremony
          * `conference` - Conference
          * `workshop` - Workshop
          * `other` - Other
      - in: query
        name: featured
        schema:
          type: boolean
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: voting_enabled
        schema:
          type: boolean
      tags:
      - api
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedEventListList'
          description: ''
  /api/events/events/{id}/:
    get:
      operationId: api_events_events_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this Events - Event.
        required: true
      tags:
      - api
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Event'
          description: ''
  /api/events/events/{id}/initiate_ticket_payment/:
    post:
      operationId: api_events_events_initiate_ticket_payment_create
      description: |-
        Initiate M-Pesa Daraja STK Push for ticket purchase.
        Creates a pending Payment record and triggers STK Push to user's phone.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this Events - Event.
        required: true
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Event'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Event'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Event'
        required: true
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Event'
          description: ''
  /api/events/events/{id}/initiate_vote_payment/:
    post:
      operationId: api_events_events_initiate_vote_payment_create
      description: |-
        Initiate M-Pesa Daraja STK Push for voting.
        Creates a pending Payment record and triggers STK Push to user's phone.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this Events - Event.
        required: true
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Event'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Event'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Event'
        required: true
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Event'
          description: ''
  /api/events/events/{id}/live_results/:
    get:
      operationId: api_events_events_live_results_retrieve
      description: Get live voting results based on event's result_visibility setting.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this Events - Event.
        required: true
      tags:
      - api
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Event'
          description: ''
  /api/events/events/{id}/register_ticket/:
    post:
      operationId: api_events_events_register_ticket_create
      description: Register a free ticket for an event. Only works for free events.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this Events - Event.
        required: true
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Event'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Event'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Event'
        required: true
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Event'
          description: ''
  /api/events/events/{id}/verify_payment/:
    post:
      operationId: api_events_events_verify_payment_create
      description: Admin verifies a payment, triggers ticket/vote processing.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this Events - Event.
        required: true
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Event'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Event'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Event'
        required: true
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Event'
          description: ''
  /api/events/events/{id}/vote_verify/:
    get:
      operationId: api_events_events_vote_verify_retrieve
      description: Verify votes by phone number for this event.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this Events - Event.
        required: true
      tags:
      - api
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Event'
          description: ''
  /api/events/events/featured/:
    get:
      operationId: api_events_events_featured_retrieve
      tags:
      - api
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Event'
          description: ''
  /api/events/events/past/:
    get:
      operationId: api_events_events_past_retrieve
      tags:
      - api
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Event'
          description: ''
  /api/events/events/upcoming/:
    get:
      operationId: api_events_events_upcoming_retrieve
      tags:
      - api
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Event'
          description: ''
  /api/events/events/voting_events/:
    get:
      operationId: api_events_events_voting_events_retrieve
      description: Get events that have voting enabled and are in voting_open status
      tags:
      - api
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Event'
          description: ''
  /api/events/finance/report/:
    post:
      operationId: api_events_finance_report_create
      description: |-
        PIN-protected revenue report across voting, ticketing and contributions.

        Body: { pin, date_from?, date_to?, source?, event?, phone?, mpesa_code?, status? }
      tags:
      - api
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          description: No response body
  /api/events/finance/statement-pdf/:
    post:
      operationId: api_events_finance_statement_pdf_create
      description: |-
        PIN-protected PDF statement of the filtered revenue report.

        Body: same filters as finance_report.
      tags:
      - api
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          description: No response body
  /api/events/mpesa-callback/:
    post:
      operationId: api_events_mpesa_callback_create
      description: |-
        M-Pesa Daraja STK Push callback endpoint.
        Processes payment callbacks and routes based on payment_purpose.

        IMPORTANT: This endpoint always responds with HTTP 200 and the
        Safaricom-expected acknowledgement body. Returning any non-200 status makes
        Safaricom retry the same callback repeatedly, which would double-count votes
        or resend tickets. All errors are logged instead of surfaced as 500s.
      tags:
      - api
      security:
      - {}
      responses:
        '200':
          description: No response body
  /api/events/payments/:
    get:
      operationId: api_events_payments_list
      parameters:
      - in: query
        name: event
        schema:
          type: integer
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - in: query
        name: payment_purpose
        schema:
          type: string
          enum:
          - donation
          - ticket
          - vote
        description: |-
          Purpose of this payment: ticket, vote, or donation

          * `ticket` - Ticket
          * `vote` - Vote
          * `donation` - Donation
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: status
        schema:
          type: string
          enum:
          - cancelled
          - failed
          - pending
          - reversed
          - successful
        description: |-
          * `pending` - Pending
          * `successful` - Successful
          * `failed` - Failed
          * `cancelled` - Cancelled
          * `reversed` - Reversed
      tags:
      - api
      security:
      - cookieAuth: []
      - basicAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedPaymentList'
          description: ''
    post:
      operationId: api_events_payments_create
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentCreate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PaymentCreate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PaymentCreate'
        required: true
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentCreate'
          description: ''
  /api/events/payments/{id}/:
    get:
      operationId: api_events_payments_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this Events - Payment.
        required: true
      tags:
      - api
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'
          description: ''
    put:
      operationId: api_events_payments_update
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this Events - Payment.
        required: true
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Payment'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Payment'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Payment'
        required: true
      security:
      - cookieAuth: []
      - basicAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'
          description: ''
    patch:
      operationId: api_events_payments_partial_update
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this Events - Payment.
        required: true
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedPayment'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedPayment'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedPayment'
      security:
      - cookieAuth: []
      - basicAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'
          description: ''
    delete:
      operationId: api_events_payments_destroy
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this Events - Payment.
        required: true
      tags:
      - api
      security:
      - cookieAuth: []
      - basicAuth: []
      responses:
        '204':
          description: No response body
  /api/events/pesapal-ipn/:
    get:
      operationId: api_events_pesapal_ipn_retrieve
      description: |-
        PesaPal IPN (Instant Payment Notification) endpoint.
        PesaPal sends a GET request with OrderTrackingId and OrderMerchantReference
        whenever the payment state changes.

        Handles both Contribution and Payment (vote/ticket) records.
        The OrderMerchantReference encodes the type:
          MCK-VOTE-{id}    → Payment with payment_type='vote'
          MCK-TICKET-{id}  → Payment with payment_type='ticket'
          MCK-CONTRIB-*    → Contribution
      tags:
      - api
      security:
      - {}
      responses:
        '200':
          description: No response body
  /api/events/pesapal-redirect/:
    get:
      operationId: api_events_pesapal_redirect_retrieve
      description: |-
        PesaPal redirects the user's browser here after they complete (or abandon) payment.
        Verifies the status and redirects to the frontend with a status param.

        Routes:
          Contribution → /contribute?payment=success|failed
