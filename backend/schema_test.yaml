        ip_address:
          type: string
          readOnly: true
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - contestant
      - contestant_name
      - created_at
      - event
      - event_title
      - id
      - ip_address
      - phone_number
      - updated_at
      - vote_count
    VoteTransactionStatusEnum:
      enum:
      - pending
      - successful
      - failed
      - reversed
      type: string
      description: |-
        * `pending` - Pending
        * `successful` - Successful
        * `failed` - Failed
        * `reversed` - Reversed
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
    cookieAuth:
      type: apiKey
      in: cookie
      name: sessionid
